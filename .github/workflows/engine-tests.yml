name: Engine characterization tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.js'
      - 'vercel.json'
      - '.vercelignore'
      - '.github/workflows/engine-tests.yml'
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.js'
      - 'vercel.json'
      - '.vercelignore'
      - '.github/workflows/engine-tests.yml'

permissions:
  contents: read

concurrency:
  group: engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run engine characterization tests
        run: npm test
      - name: Build production bundle
        run: npm run build
