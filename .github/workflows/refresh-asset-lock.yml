name: Generate dependency lock for optimization
on:
  pull_request:
    paths:
      - 'package.json'
      - '.github/workflows/refresh-asset-lock.yml'
permissions:
  contents: read
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm lock metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit lock for versioning
        run: |
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const data = fs.readFileSync("package-lock.json","utf8");
            const size = 2000;
            console.log("KURO_LOCK_BEGIN=" + Math.ceil(data.length / size));
            for(let i=0;i<data.length;i+=size) {
              console.log("KURO_LOCK_PART=" + String(i / size).padStart(3,"0") + ":" + JSON.stringify(data.slice(i,i+size)));
            }
            console.log("KURO_LOCK_END");
          '
